# MLwx-mosmix: keep every new MOSMIX_L issue for the listed stations (DECISIONS D81, D122).
#
# Every three hours at 50 minutes past (UTC), and by hand. DWD keeps only about two days of issues, so a
# run can be missed for about 40 hours before anything is lost. Each run:
#   1. checks out this repo's main (the manifest);
#   2. runs saver.py --save: lists each station's directory on DWD's server, downloads every issue the
#      manifest does not yet hold, checks each file, makes one tar per issue and adds rows to the manifest
#      (in the run's working folder only; nothing is committed yet). A failure here is remembered, and
#      the run carries on, so that files already saved are not lost; the job fails at the end;
#   3. uploads each new tar as an asset of that month's Release (mosmix-YYYY-MM), creating the Release if
#      it is missing. An asset is never replaced (the upload has no overwrite flag). If an upload fails, the job fails here,
#      before anything is committed, so no manifest row ever points to an asset that is not there;
#   4. commits and pushes the manifest, only if it changed. A rejected push is rebased once and pushed
#      again; if it still does not land, the job fails;
#   5. runs saver.py --check-fresh: the job fails if the newest issue held is more than 12 hours older than
#      the newest issue listed on the server;
#   6. fails the job (so GitHub tells the owner) if step 2 had a failure.

name: save

on:
  schedule:
    - cron: "50 */3 * * *"   # every three hours at 50 minutes past, UTC
  workflow_dispatch:

# One run at a time: the manifest is only ever added to.
concurrency:
  group: save
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write        # push the manifest, create Releases and upload their assets
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out this repo (the manifest)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Save the new issues
        id: save
        run: |
          set +e
          python saver.py --save out --manifest-dir manifest
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload each new tar to that month's Release
        run: |
          shopt -s nullglob
          for f in out/tars/*.tar; do
            name="$(basename "$f")"
            if [[ "$name" =~ ^MOSMIX_L_([0-9]{4})([0-9]{2})[0-9]{4}_run ]]; then
              tag="mosmix-${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
            else
              echo "Unexpected tar name: $name"; exit 1
            fi
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                --title "MOSMIX_L ${BASH_REMATCH[1]}-${BASH_REMATCH[2]}" \
                --notes "MOSMIX_L single-station files saved unchanged, one tar per issue and run. Rows: manifest/${BASH_REMATCH[1]}-${BASH_REMATCH[2]}.csv."
            fi
            gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY"
            echo "uploaded $name to $tag"
          done

      - name: Commit and push the manifest
        run: |
          git config user.name "mlwx-mosmix"
          git config user.email "mlwx-mosmix@users.noreply.github.com"
          git add manifest
          if git diff --cached --quiet; then
            echo "The manifest did not change: nothing to commit."
          else
            git commit -m "Issues saved by the run of $(date -u +%Y-%m-%dT%H:%MZ)"
            if ! git push; then
              echo "The push was rejected: rebasing once and pushing again."
              if ! git pull --rebase; then
                git rebase --abort || true
                echo "The rebase onto origin/main failed and was aborted."
                exit 1
              fi
              git push
            fi
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "The push did not land: local HEAD $(git rev-parse HEAD) is not origin/main $(git rev-parse origin/main)."
            exit 1
          fi

      - name: Check that the newest issue held is fresh
        run: python saver.py --check-fresh --manifest-dir manifest

      - name: Fail the job if the save had a failure
        if: always() && steps.save.outputs.code != '' && steps.save.outputs.code != '0'
        run: |
          echo "saver.py --save finished with exit code ${{ steps.save.outputs.code }}; see its output above."
          exit 1
