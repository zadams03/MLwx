<svg xmlns="http://www.w3.org/2000/svg" width="800" height="472" viewBox="0 0 800 472" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="title">How each claim was tested</title>
<desc id="desc">Two timelines, one for the six-airport claim and one for the live forward test, each going from rules written down, to one look at years the model never saw, to a verdict, with the dates; the claim passed and the live test is not yet scored.</desc>
<defs></defs>
<rect x="0" y="0" width="800" height="472" fill="#ffffff"/>
<text x="20.00" y="30.00" font-size="17" text-anchor="start" fill="#1a1a1a" font-weight="bold">How each claim was tested</text>
<text x="20.00" y="52.00" font-size="12" text-anchor="start" fill="#4d4d4d" font-weight="normal">Rules first, then one look at years the model never saw, then the verdict.</text>
<text x="20.00" y="84.00" font-size="14" text-anchor="start" fill="#1a1a1a" font-weight="bold">The six-airport claim (finished)</text>
<rect x="20" y="96" width="236" height="150" rx="8" fill="#f3f4f6" stroke="#4d4d4d" stroke-width="1"/>
<text x="34.00" y="122.00" font-size="13.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">1. Rules written down</text>
<text x="34.00" y="142.00" font-size="12.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">11 Oct 2026</text>
<text x="34.00" y="166.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">Method, settings and pass rule</text>
<text x="34.00" y="183.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">fixed in writing. Models trained</text>
<text x="34.00" y="200.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">only on data before 1 Aug 2024,</text>
<text x="34.00" y="217.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">then frozen.</text>
<line x1="258.00" y1="171.00" x2="274.00" y2="171.00" stroke="#4d4d4d" stroke-width="2"/>
<polygon points="273,165.00 273,177.00 281,171.00" fill="#4d4d4d"/>
<rect x="282" y="96" width="236" height="150" rx="8" fill="#f3f4f6" stroke="#4d4d4d" stroke-width="1"/>
<text x="296.00" y="122.00" font-size="13.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">2. One look at unseen years</text>
<text x="296.00" y="142.00" font-size="12.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">run once on 11 Oct 2026</text>
<text x="296.00" y="166.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">Year 1: 1 Aug 2024 to 31 Jul 2025</text>
<text x="296.00" y="183.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">Year 2: 1 Aug 2025 to 31 Jul 2026</text>
<text x="296.00" y="200.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">The models had never seen them.</text>
<line x1="520.00" y1="171.00" x2="536.00" y2="171.00" stroke="#4d4d4d" stroke-width="2"/>
<polygon points="535,165.00 535,177.00 543,171.00" fill="#4d4d4d"/>
<rect x="544" y="96" width="236" height="150" rx="8" fill="#f3f4f6" stroke="#0072B2" stroke-width="2"/>
<text x="558.00" y="122.00" font-size="13.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">3. The verdict</text>
<text x="558.00" y="142.00" font-size="12.5" text-anchor="start" fill="#0072B2" font-weight="bold">passed</text>
<text x="558.00" y="166.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">Passed at 6 of 6 airports, hourly</text>
<text x="558.00" y="183.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">and daily maximum, in both years.</text>
<text x="558.00" y="200.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">Smallest margins: +8.2% hourly,</text>
<text x="558.00" y="217.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">+2.6% daily (Chicago, year 2).</text>
<text x="20.00" y="270.00" font-size="14" text-anchor="start" fill="#1a1a1a" font-weight="bold">The live forward test, 49 airports (running)</text>
<rect x="20" y="282" width="236" height="150" rx="8" fill="#f3f4f6" stroke="#4d4d4d" stroke-width="1"/>
<text x="34.00" y="308.00" font-size="13.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">1. Rules written down</text>
<text x="34.00" y="328.00" font-size="12.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">14 Oct 2026</text>
<text x="34.00" y="352.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">Test fixed in writing before any</text>
<text x="34.00" y="369.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">forecast is scored. Forecasts have</text>
<text x="34.00" y="386.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">been logged since 12 Oct 2026,</text>
<text x="34.00" y="403.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">each written once, never edited.</text>
<line x1="258.00" y1="357.00" x2="274.00" y2="357.00" stroke="#4d4d4d" stroke-width="2"/>
<polygon points="273,351.00 273,363.00 281,357.00" fill="#4d4d4d"/>
<rect x="282" y="282" width="236" height="150" rx="8" fill="#f3f4f6" stroke="#4d4d4d" stroke-width="1"/>
<text x="296.00" y="308.00" font-size="13.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">2. One look per period, later</text>
<text x="296.00" y="328.00" font-size="12.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">after each period ends</text>
<text x="296.00" y="352.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">The test covers forecasts up to</text>
<text x="296.00" y="369.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">31 Jul 2027. Each period is</text>
<text x="296.00" y="386.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">scored once, only after it</text>
<text x="296.00" y="403.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">has ended.</text>
<line x1="520.00" y1="357.00" x2="536.00" y2="357.00" stroke="#4d4d4d" stroke-width="2"/>
<polygon points="535,351.00 535,363.00 543,357.00" fill="#4d4d4d"/>
<rect x="544" y="282" width="236" height="150" rx="8" fill="#f3f4f6" stroke="#4d4d4d" stroke-width="1" stroke-dasharray="6 4"/>
<text x="558.00" y="308.00" font-size="13.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">3. The verdict</text>
<text x="558.00" y="328.00" font-size="12.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">not yet scored</text>
<text x="558.00" y="352.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">No accuracy figure is shown for</text>
<text x="558.00" y="369.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">the live tool until this look</text>
<text x="558.00" y="386.00" font-size="12" text-anchor="start" fill="#1a1a1a" font-weight="normal">has been run.</text>
<text x="20.00" y="458.00" font-size="11" text-anchor="start" fill="#4d4d4d" font-weight="normal">Time runs left to right. Dates are those in the project's public, timestamped record.</text>
</svg>
