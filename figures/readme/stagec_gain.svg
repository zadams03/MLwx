<title id="title">How much lower the error is than raw GFS</title>
<desc id="desc">Per cent by which the corrected forecast's mean absolute error is lower than raw GFS, first value 2024-25 and second value 2025-26. hourly curve: EDDM 24.83 and 26.96; KORD 14.39 and 8.22; CYYZ 22.04 and 23.48; ZGSZ 21.63 and 23.09; ZUCK 23.91 and 27.07; NZWN 31.71 and 32.99. daily maximum: EDDM 29.14 and 31.44; KORD 9.32 and 2.59; CYYZ 23.19 and 21.22; ZGSZ 40.31 and 39.63; ZUCK 14.84 and 14.14; NZWN 55.74 and 57.21.</desc>
